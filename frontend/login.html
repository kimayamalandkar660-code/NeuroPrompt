<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroPrompt - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #10172a, #263b68);
            color: white;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            background: #1c2740;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #72a7ff;
        }

        p {
            text-align: center;
            color: #c5cee0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #52617e;
            border-radius: 7px;
            background: #101a30;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 7px;
            background: #3979e8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2864ca;
        }

        .register {
            margin-top: 20px;
            text-align: center;
        }

        a {
            color: #72a7ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h1>NeuroPrompt</h1>
        <p>Code Debugger Assistant</p>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required>

            <button type="submit">Login</button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="/register">Register</a>
        </div>
    </div>

</body>
</html>
